<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armenian Connections</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Connections</h1>
  <div id="date-display"></div>
  <p id="subtitle">Ստեղծէ 4 բառերէ բաղկացած 4 խումբեր (Create 4 groups of 4 words)</p>

  <div id="solved-container"></div>
  <div id="grid"></div>

  <div id="mistakes-container">
    Սխալներ (Mistakes remaining): 
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <div class="controls">
    <button id="shuffle-btn">Խառնել (Shuffle)</button>
    <button id="deselect-btn">Չեղարկել (Deselect All)</button>
    <button id="submit-btn" disabled>Ուղարկել (Submit)</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
